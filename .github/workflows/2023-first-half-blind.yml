name: 2023 first-half ten-trigger blind hindcast

on:
  push:
    branches:
      - feature/2023-first-half-blind-test
    paths:
      - "research/**"
      - ".github/workflows/2023-first-half-blind.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 2023-first-half-blind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blind-hindcast:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/requirements.txt

      - name: Compile research package
        run: python -m compileall -q research

      - name: Run scientific and model tests
        run: pytest -q research/tests

      - name: Run ten evenly-spaced H1 2023 blind trigger forecasts
        run: |
          python -m research.run_blind_test \
            --start-year 2023 \
            --end-year 2023 \
            --start-date 2023-01-01T00:00:00Z \
            --end-date 2023-07-01T00:00:00Z \
            --max-triggers 10 \
            --no-controls \
            --download-coupling \
            --download-slab2 \
            --output research/outputs/2023-first-half-blind

      - name: Upload forecasts and blind scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2023-first-half-ten-trigger-blind-test
          path: research/outputs/2023-first-half-blind/
          if-no-files-found: warn
          retention-days: 30
