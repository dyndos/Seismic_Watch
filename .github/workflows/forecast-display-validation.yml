name: Forecast presentation validation

on:
  push:
    branches:
      - feature/forecast-location-visualization
    paths:
      - "research/**"
      - "docs/FORECAST_DISPLAY_RU.md"
      - ".github/workflows/forecast-display-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/requirements.txt
      - name: Compile research package
        run: python -m compileall -q research
      - name: Run scientific and model tests
        run: pytest -q research/tests
