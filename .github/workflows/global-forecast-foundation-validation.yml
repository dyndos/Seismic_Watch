name: Global forecast foundation validation

on:
  push:
    branches:
      - feature/global-forecast-foundation
    paths:
      - "research/data/source_registry.json"
      - "research/data/model_registry.json"
      - "research/validate_registries.py"
      - "research/tests/test_registries.py"
      - "research/**"
      - "docs/GLOBAL_FORECAST_ARCHITECTURE_RU.md"
      - "docs/MODEL_AUDIT_K0_K4_RU.md"
      - ".github/workflows/global-forecast-foundation-validation.yml"
  pull_request:
    paths:
      - "research/data/source_registry.json"
      - "research/data/model_registry.json"
      - "research/validate_registries.py"
      - "research/tests/test_registries.py"
      - "research/**"
      - "docs/GLOBAL_FORECAST_ARCHITECTURE_RU.md"
      - "docs/MODEL_AUDIT_K0_K4_RU.md"

permissions:
  contents: read

concurrency:
  group: global-forecast-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-and-research-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/requirements.txt
      - name: Validate source and model registries
        run: python -m research.validate_registries
      - name: Compile research package
        run: python -m compileall -q research
      - name: Run research tests
        run: pytest -q research/tests
