name: Research blind-style hindcast

on:
  push:
    branches:
      - feature/historical-backtesting
    paths:
      - "research/**"
      - ".github/workflows/research-blind-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hindcast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/requirements.txt

      - name: Compile research package
        run: python -m compileall -q research

      - name: Run scientific and model tests
        run: pytest -q research/tests

      - name: Run Turkey 2023 K0-K4 case study
        run: python -m research.run_turkey_case --download-coupling --download-slab2 --output research/outputs/turkey-2023-case

      - name: Run expanded historical hindcast
        run: |
          python -m research.run_blind_test \
            --start-year 2000 \
            --end-year 2025 \
            --max-triggers 0 \
            --download-coupling \
            --download-slab2 \
            --output research/outputs/blind-test

      - name: Upload frozen forecasts and scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seismic-watch-hindcast-${{ github.run_number }}
          path: |
            research/outputs/blind-test/
            research/outputs/turkey-2023-case/
          if-no-files-found: warn
          retention-days: 30
