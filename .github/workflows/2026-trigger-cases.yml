name: 2026 Tibet and Flores K0-K4 prospective forecasts

on:
  push:
    branches:
      - feature/2026-earthquake-trigger-cases
    paths:
      - "research/run_2026_trigger_cases.py"
      - ".github/workflows/2026-trigger-cases.yml"
      - "research/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 2026-trigger-cases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-case-studies:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/requirements.txt

      - name: Compile research package
        run: python -m compileall -q research

      - name: Run scientific and model tests
        run: pytest -q research/tests

      - name: Run 2026 Tibet and Flores prospective forecasts
        run: |
          python -m research.run_2026_trigger_cases \
            --download-coupling \
            --download-slab2 \
            --output research/outputs/2026-trigger-cases

      - name: Upload frozen forecasts and scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2026-earthquake-prospective-forecasts
          path: research/outputs/2026-trigger-cases/
          if-no-files-found: warn
          retention-days: 30
