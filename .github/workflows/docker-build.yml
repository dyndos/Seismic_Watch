name: Seismic Watch Docker build check

on:
  push:
    branches:
      - feature/2023-first-half-blind-test
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "package.json"
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "postcss.config.mjs"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Seismic Watch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: seismic-watch:ci
